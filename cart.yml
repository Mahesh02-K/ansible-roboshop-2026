- name: configuring cart component
  hosts: cart
  become: yes
  tasks:
  - name: Disabling default nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: Enabling nodejs 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: Installing nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: Creating app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: creating system user
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app

  - name: downloading cart code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip

  # this module thinks file exist on ansible control server, needs to extract on to remote machine
  # remote_src: yes means files already exist in cart server
  - name: extract cart code
    ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes

  - name: Installing dependencies
    community.general.npm:
      path: /app

  - name: copying cart service file into system directory
    ansible.builtin.copy:
      src: cart.service
      dest: /etc/systemd/system/cart.service

  - name: Daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: Enable and start cart service
    ansible.builtin.service:
      name: cart
      state: started
      enabled: yes